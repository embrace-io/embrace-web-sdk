version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/cli'
      - '/demo/frontend'
      - '/demo/frontend-cdn'
      - '/demo/frontend-sdk'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5

    groups:
      # Production dependencies - keep separate and prioritized
      open-telemetry:
        patterns:
          - '@opentelemetry*'

      production-deps:
        patterns:
          - 'hoist-non-react-statics'
          - 'uuid'
          - 'web-vitals'

      # Build and dev tools - batch together
      dev-tooling:
        patterns:
          - '@swc/*'
          - 'es-check'
          - 'esbuild'
          - 'globals'
          - 'publint'
          - 'sonda'
          - 'terser'
          - 'tsdown'
          - 'tsx'
          - 'typescript'
          - '*vite*'

      # Type definitions
      types:
        patterns:
          - '@types/*'

      # Commit and code quality tools
      code-quality:
        patterns:
          - '@commitlint/*'
          - '*eslint*'
          - '*prettier*'

      # Testing
      test-tools:
        patterns:
          - '*chai*'
          - '*chrome*'
          - '*jest*'
          - '*mocha*'
          - '*playwright*'
          - '*sinon*'
          - '*test-runner*'

      # React ecosystem
      react:
        patterns:
          - '*react*'
