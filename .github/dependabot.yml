version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/cli'
      - '/demo/frontend'
      - '/demo/frontend-cdn'
      - '/demo/webpack-example'
      - '/tests/integration'
      - '/tests/integration/platforms/next-latest'
      - '/tests/integration/platforms/vite-7'
      - '/tests/integration/platforms/webpack-5'
      - '/tests/performance'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 50
    groups:
      vite:
        patterns:
          - '*vite*'
      otel:
        patterns:
          - '@opentelemetry*'
      eslint:
        patterns:
          - '*eslint*'
      react:
        patterns:
          - 'react*'
          - '*/react*'
      playwright:
        patterns:
          - '*playwright*'
  # lock webpack 4 version integration test - only allow minor and patch updates
  - package-ecosystem: 'npm'
    directory: '/tests/integration/platforms/webpack-4'
    schedule:
      interval: 'weekly'
    ignore:
      # Block all major version updates for all dependencies
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  # force otel-latest integration test to run on latest version
  - package-ecosystem: 'npm'
    directory: '/tests/integration/platforms/vite-otel-latest'
    schedule:
      interval: 'weekly'
    versioning-strategy: 'increase' # Always update to latest versions
