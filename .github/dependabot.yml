version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/cli'
      - '/demo/frontend'
      - '/demo/frontend-cdn'
      - '/demo/webpack-example'
      - '/tests/performance'
      - '/tests/integration'

    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 50
    groups:
      eslint:
        patterns:
          - '*eslint*'
      react:
        patterns:
          - 'react*'
      playwright:
        patterns:
          - '*playwright*'
