name: Publish Frontend Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - package*.json
      - packages/web-sdk/src/**
      - .nvmrc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build demo
        run: npx turbo run build --filter=embrace-web-sdk-react-demo

      - name: Verify build output
        run: |
          if [ ! -d demo/frontend/dist ] || [ -z $(ls -A demo/frontend/dist) ]; then
            echo Error: Build output directory is missing or empty
            exit 1
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload dist folder
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: demo/frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
