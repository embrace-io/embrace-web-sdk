name: Bump packages version

on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  next-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: release-drafter/release-drafter@b1476f6e6eb133afa41ed8589daba6dc69b4d3f5 # v6.1.0
        id: release_drafter
        with:
          # dry run, we just want to identify the next version, not publish it yet
          dry-release: true
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Setup ack
        run: |
          sudo apt-get update
          sudo apt-get install ack
      - name: Update package.json version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION: ${{ steps.release_drafter.outputs.resolved_version }}
        run: |
          version="${STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION}"
          if [ -z "$version" ]; then
            echo 'Version is empty. Exiting'
            exit 1
          fi
          PREVIOUS_VERSION=$(jq '.version' package.json)

          echo 'Updating package.json version to $version'

          # update sdk version
          jq --arg version "$version" '.version = $version' package.json > tmp.json && mv tmp.json package.json

          # update cli version
          jq --arg version "$version" '.version = $version' cli/package.json > tmp.json && mv tmp.json cli/package.json

          # update the golden files
          pushd tests/integration/tests/__golden__
          ack $PREVIOUS_VERSION -l | xargs -I@ sed -i "" "s/$PREVIOUS_VERSION/\"$version\"/g" @
          popd

          # update package-lock.json
          npm i

          # update constants files
          npm run sdk:lint:fix
      - name: commit and create PR with the next release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION: ${{ steps.release_drafter.outputs.resolved_version }}
          STEPS_RELEASE_DRAFTER_OUTPUTS_BODY: ${{ steps.release_drafter.outputs.body }}
        run: |
          # get the next version from the release-drafter output
          NEXT_VERSION="${STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION}"
          echo "PR Body:"
          echo "$STEPS_RELEASE_DRAFTER_OUTPUTS_BODY"
          # create a new branch for the release
          git checkout -b "release-$NEXT_VERSION"
          # commit the changes
          git config --global user.name 'embrace-ci'
          git config --global user.email 'embrace-ci@users.noreply.github.com'
          git add package.json package-lock.json cli/package.json demo/frontend/package.json demo/frontend-cdn/package.json src/resources/constants/index.ts cli/src/constants.ts
          git commit -m "release: update version to $NEXT_VERSION"
          git push origin "release-$NEXT_VERSION"
          # create a PR with the next version
          gh pr create --base main --title "release: bump version to $NEXT_VERSION" --body "$STEPS_RELEASE_DRAFTER_OUTPUTS_BODY" -a "$GITHUB_ACTOR" --label "release"
