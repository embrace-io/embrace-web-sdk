name: Bump packages version

on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  next-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        id: release_drafter
        with:
          # dry run, we just want to identify the next version, not publish it yet
          dry-release: true
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Update package.json version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION: ${{ steps.release_drafter.outputs.resolved_version }}
        run: |
          version="${STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION}"
          if [ -z "$version" ]; then
            echo 'Version is empty. Exiting'
            exit 1
          fi

          echo "Updating all version references to $version"
          node scripts/validate-versions.js --fix --version "$version"

          echo "Updating package-lock.json"
          npm i
      - name: commit and create PR with the next release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION: ${{ steps.release_drafter.outputs.resolved_version }}
          STEPS_RELEASE_DRAFTER_OUTPUTS_BODY: ${{ steps.release_drafter.outputs.body }}
        run: |
          # get the next version from the release-drafter output
          NEXT_VERSION="${STEPS_RELEASE_DRAFTER_OUTPUTS_RESOLVED_VERSION}"
          echo "PR Body:"
          echo "$STEPS_RELEASE_DRAFTER_OUTPUTS_BODY"
          # create a new branch for the release
          git checkout -b "release-$NEXT_VERSION"
          # commit the changes
          git config --global user.name 'embrace-ci'
          git config --global user.email 'embrace-ci@users.noreply.github.com'
          git add packages/web-sdk/package.json package-lock.json packages/web-cli/package.json packages/web-sdk/src/resources/constants/index.ts packages/web-cli/src/constants.ts tests/integration/tests/__golden__
          git commit -m "release: update version to $NEXT_VERSION"
          git push origin "release-$NEXT_VERSION"
          # create a PR with the next version
          gh pr create --base main --title "release: bump version to $NEXT_VERSION" --body "$STEPS_RELEASE_DRAFTER_OUTPUTS_BODY" -a "$GITHUB_ACTOR" --label "release"
