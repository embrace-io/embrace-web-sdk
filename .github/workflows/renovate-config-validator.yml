name: Renovate Config Validator

on:
  push:
    branches: [main]
    paths:
      - .github/renovate.json
      - packages/web-sdk/semconv/versions.env
  pull_request:
    paths:
      - .github/renovate.json
      - packages/web-sdk/semconv/versions.env

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Resolve the Renovate version the hosted app last ran
        id: renovate
        # The hosted Mend Renovate app runs a version the repo can't pin or query, but every pull
        # request it opens or rebases ends with a `renovate-debug` footer whose base64 JSON names
        # the version that produced it. The most recently updated Renovate pull request therefore
        # says what ran last, and the config is validated with that version. The pin in
        # versions.env is the fallback when no footer can be read (no Renovate pull request yet, or
        # a changed footer format).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          source packages/web-sdk/semconv/versions.env
          footer="$(gh pr list --state all --limit 1 \
            --search 'author:app/renovate sort:updated-desc' --json body --jq '.[0].body // ""' \
            | grep -o 'renovate-debug:[A-Za-z0-9+/=]*' | cut -d: -f2 || true)"
          version=""
          if [[ -n "$footer" ]]; then
            version="$(printf '%s' "$footer" | base64 -d 2>/dev/null \
              | jq -r '.updatedInVer // .createdInVer // empty' 2>/dev/null || true)"
          fi
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Validating with Renovate $version, the version the hosted app last ran."
          else
            version="$RENOVATE_VERSION"
            echo "No Renovate pull request footer found; validating with the pinned fallback $version."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate .github/renovate.json
        # LOG_FORMAT=json bypasses Renovate's async pretty-printer; the validator
        # calls process.exit() without draining streams, so in non-TTY CI any
        # in-flight pretty-printed errors are dropped before they reach the log.
        env:
          LOG_FORMAT: json
          RENOVATE_VERSION: ${{ steps.renovate.outputs.version }}
        run: |
          npx --yes --package="renovate@${RENOVATE_VERSION}" -- renovate-config-validator --no-global .github/renovate.json
