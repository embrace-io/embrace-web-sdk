name: Renovate Config Validator

on:
  push:
    branches: [main]
    paths:
      - .github/renovate.json
      - packages/web-sdk/semconv/versions.env
  pull_request:
    paths:
      - .github/renovate.json
      - packages/web-sdk/semconv/versions.env

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json

      - name: Validate .github/renovate.json
        # LOG_FORMAT=json bypasses Renovate's async pretty-printer; the validator
        # calls process.exit() without draining streams, so in non-TTY CI any
        # in-flight pretty-printed errors are dropped before they reach the log.
        # The Renovate version is the one versions.env pins, so a new release arrives as a bump of
        # that pin, which this workflow checks before it merges.
        env:
          LOG_FORMAT: json
        run: |
          source packages/web-sdk/semconv/versions.env
          npx --yes --package="renovate@${RENOVATE_VERSION}" -- renovate-config-validator --no-global .github/renovate.json
