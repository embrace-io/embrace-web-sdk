# Regenerates packages/web-sdk/src/semconv/ from the pinned embrace-semconv registry and fails
# when the committed code differs or doesn't type-check.
name: Semconv CI validation

# No `paths:` filter: the aggregate job is a required check, and a required check that never runs
# blocks the pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The directory holding the project's Makefile, relative to the repo root.
defaults:
  run:
    working-directory: packages/web-sdk/semconv

jobs:
  validate-generated:
    name: Validate generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned weaver version
        id: weaver
        run: |
          source versions.env
          echo "version=$WEAVER_VERSION" >> "$GITHUB_OUTPUT"

      # `$/` is GitHub's syntax for this repository's own actions, at the commit running.
      - name: Install Weaver
        uses: $/.github/actions/setup-weaver
        with:
          version: ${{ steps.weaver.outputs.version }}

      - name: Regenerate the code
        run: make generate

      - name: Compare committed code with the regenerated code
        uses: $/.github/actions/assert-no-drift
        with:
          path: packages/web-sdk/src/semconv
          label: generated code
          regenerate-hint: |
            # run in the project directory (packages/web-sdk/semconv):
            make install-weaver   # once, if weaver is not on PATH
            make generate
            git add ../src/semconv/

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install npm dependencies
        working-directory: .
        run: npm ci

      # Reruns `make generate` first, so it fetches too.
      - name: Validate the generated code
        run: make validate-generated

  # Aggregate gate for branch protection: require only this job. Branch protection sees a job by
  # its `name:`, so keep the name identical to the id, unique among the repo's workflows, and name
  # it in the protection rule.
  semconv-required-status-check:
    name: semconv-required-status-check
    if: always()
    # No checkout here, so the project directory doesn't exist.
    defaults:
      run:
        working-directory: .
    needs:
      - validate-generated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any dependency did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
