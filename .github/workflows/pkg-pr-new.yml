# Manual trigger for publishing preview packages to pkg.pr.new.
# Automatic preview publishing happens in CI workflow (ci-nodejs.yml)
# after all checks pass on pushes to main.
name: Preview

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK and CLI
        run: npm run build

      - name: Publish preview packages
        run: npx --yes pkg-pr-new publish --compact './packages/web-sdk' './packages/web-cli'
