# Manual trigger for publishing preview packages to pkg.pr.new.
# Automatic preview publishing happens in CI workflow (ci-nodejs.yml)
# after all checks pass on pushes to main.
name: Preview

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build SDK and CLI
        run: npm run build

      - name: Publish preview packages
        run: npx --yes pkg-pr-new publish --compact './packages/web-sdk' './packages/web-cli'
