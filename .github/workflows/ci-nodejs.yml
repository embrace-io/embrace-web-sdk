name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [released]

permissions:
  contents: read

env:
  LINT_STATUS_FILE: lint.success.txt
  TYPE_CHECK_STATUS_FILE: type_check.success.txt
  TEST_STATUS_FILE: test.success.txt

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.choose_environment.outputs.name }}
      name_short: ${{ steps.choose_environment.outputs.name_short }}
      URL: ${{ steps.choose_environment.outputs.URL }}
    steps:
      - name: Choose environment
        id: choose_environment
        run: |
          # Finalized releases get deployed to prod
          if [ '${{ github.event_name }}' == 'release' ] && [ "$GITHUB_EVENT_ACTION" == 'released' ]; then
              echo "Setting environment=production"
              echo 'name=production' >> $GITHUB_OUTPUT
          # All pushes to main get deployed to staging
          elif [ "$GITHUB_REF" == 'refs/heads/main' ] && [ '${{ github.event_name }}' == 'push' ]; then
              echo "Setting environment=staging"
              echo 'name=staging' >> $GITHUB_OUTPUT
          else
              echo "Setting environment=development"
              echo 'name=development' >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}

  test-sdk:
    needs:
      - environment
    runs-on: ubuntu-latest
    # staging and production run test-sdk-multiple-browsers, and development just runs regular test-sdk
    # also run these in staging so that we generate code coverage for pushes to main
    if: ${{ needs.environment.outputs.name == 'development' || needs.environment.outputs.name == 'staging' }}
    timeout-minutes: 5
    steps:
      - name: Restore previous test results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.TEST_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if test previously succeeded
        run: |
          if test -e ${{ env.TEST_STATUS_FILE }}; then
            echo 'TEST_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'TEST_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}

      - name: Install npm dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Get installed Playwright version
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        id: playwright-version
        run: echo "version=$(npm why --json playwright | jq --raw-output '.[].version' )" >> $GITHUB_OUTPUT

      - name: Restore cached playwright browsers
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        id: playwright-cache
        with:
          path: "~/.cache/ms-playwright"
          key: "${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}"
          # As a fallback, if the Playwright version has changed, try use the
          # most recently cached version. There's a good chance that at least one
          # of the browser binary versions haven't been updated, so Playwright can
          # skip installing that in the next step.
          # Note: When falling back to an old cache, `cache-hit` (used below)
          # will be `false`. This allows us to restore the potentially out of
          # date cache, but still let Playwright decide if it needs to download
          # new binaries or not.
          restore-keys: |
            ${{ runner.os }}-playwright-

      # If the Playwright browser binaries weren't restored, we tell
      # playwright to install everything for us.
      - name: Install Playwright browsers with dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npm run playwright -- install --with-deps

      # If the Playwright browser binaries were restored, we tell
      # playwright to install just system deps.
      - name: Install Playwright's dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npm run playwright -- install-deps

      - name: Test with coverage
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          # Disable coverage for releases to speed up tests, since nobody will see coverage results anyway
          if [[ "${{ github.event_name }}/$GITHUB_EVENT_ACTION" == 'release/released' || "$GITHUB_ACTOR" == 'dependabot[bot]' ]]; then
            argsCoverage=''
          else
            argsCoverage='--config=web-test-runner.coverage.config.js'
            echo 'TEST_COLLECTED_COVERAGE=true' >> $GITHUB_ENV
          fi
          npm run sdk:test -- $argsCoverage
        env:
          GITHUB_EVENT_ACTION: ${{ github.event.action }}

      - name: Cache successful test results
        if: ${{ success() }}
        run: |
          touch ${{ env.TEST_STATUS_FILE }}

      - name: Do not cache test failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.TEST_STATUS_FILE }}

      # https://github.com/codecov/codecov-action
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && github.event_name != 'release' && env.TEST_COLLECTED_COVERAGE == 'true' && success()}}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: embrace-io/embrace-web-sdk

  test-sdk-multiple-browsers:
    needs:
      - environment
    runs-on: ubuntu-latest
    # staging and production run test-sdk-multiple-browsers, and development just runs regular test-sdk
    if: ${{ needs.environment.outputs.name != 'development' }}
    timeout-minutes: 10
    steps:
      - name: Restore previous test results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.TEST_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if test previously succeeded
        run: |
          if test -e ${{ env.TEST_STATUS_FILE }}; then
            echo 'TEST_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'TEST_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}

      - name: Install npm dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Get installed Playwright version
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        id: playwright-version
        run: echo "version=$(npm why --json playwright | jq --raw-output '.[].version' )" >> $GITHUB_OUTPUT

      - name: Restore cached playwright browsers
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        id: playwright-cache
        with:
          path: "~/.cache/ms-playwright"
          key: "${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}"
          # As a fallback, if the Playwright version has changed, try use the
          # most recently cached version. There's a good chance that at least one
          # of the browser binary versions haven't been updated, so Playwright can
          # skip installing that in the next step.
          # Note: When falling back to an old cache, `cache-hit` (used below)
          # will be `false`. This allows us to restore the potentially out of
          # date cache, but still let Playwright decide if it needs to download
          # new binaries or not.
          restore-keys: |
            ${{ runner.os }}-playwright-

      # If the Playwright browser binaries weren't restored, we tell
      # playwright to install everything for us.
      - name: Install Playwright browsers with dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npm run playwright -- install --with-deps

      # If the Playwright browser binaries were restored, we tell
      # playwright to install just system deps.
      - name: Install Playwright's dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npm run playwright -- install-deps

      - name: Test SDK multiple browsers
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run sdk:test:multiBrowsers

      - name: Cache successful test results
        if: ${{ success() }}
        run: |
          touch ${{ env.TEST_STATUS_FILE }}

      - name: Do not cache test failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.TEST_STATUS_FILE }}

  test-performance:
    env:
      TOTAL_SIZE_OF_REQUESTS_THRESHOLD_IN_KB: ${{ vars.TOTAL_SIZE_OF_REQUESTS_THRESHOLD_IN_KB }}
      TOTAL_SCRIPT_DURATION_THRESHOLD_IN_MS: ${{ vars.TOTAL_SCRIPT_DURATION_THRESHOLD_IN_MS }}
      TOTAL_TASK_DURATION_THRESHOLD_IN_MS: ${{ vars.TOTAL_TASK_DURATION_THRESHOLD_IN_MS }}
      TOTAL_HEAP_SIZE_THRESHOLD_IN_MB: ${{ vars.TOTAL_HEAP_SIZE_THRESHOLD_IN_MB }}
      TOTAL_BLOCKING_TIME_THRESHOLD_IN_MS: ${{ vars.TOTAL_BLOCKING_TIME_THRESHOLD_IN_MS }}
      MAIN_THREAD_TIME_THRESHOLD_IN_MS: ${{ vars.MAIN_THREAD_TIME_THRESHOLD_IN_MS }}
      SCRIPT_EVAL_THRESHOLD_IN_MS: ${{ vars.SCRIPT_EVAL_THRESHOLD_IN_MS }}
    needs:
      - environment
    runs-on: ubuntu-latest
    # Run on PRs, also run these in staging so that we generate code coverage for pushes to main
    if: ${{ needs.environment.outputs.name == 'development' || needs.environment.outputs.name == 'staging' }}
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Restore previous test results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.TEST_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if test previously succeeded
        run: |
          if test -e ${{ env.TEST_STATUS_FILE }}; then
            echo 'TEST_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'TEST_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}

      - name: Install npm dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Get installed Playwright version
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        id: playwright-version
        run: echo "version=$(npm why --json playwright | jq --raw-output '.[].version' )" >> $GITHUB_OUTPUT

      - name: Restore cached playwright browsers
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        id: playwright-cache
        with:
          path: "~/.cache/ms-playwright"
          key: "${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}"
          # As a fallback, if the Playwright version has changed, try use the
          # most recently cached version. There's a good chance that at least one
          # of the browser binary versions haven't been updated, so Playwright can
          # skip installing that in the next step.
          # Note: When falling back to an old cache, `cache-hit` (used below)
          # will be `false`. This allows us to restore the potentially out of
          # date cache, but still let Playwright decide if it needs to download
          # new binaries or not.
          restore-keys: |
            ${{ runner.os }}-playwright-

      # If the Playwright browser binaries weren't restored, we tell
      # playwright to install everything for us.
      - name: Install Playwright browsers with dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npm run playwright -- install --with-deps

      # If the Playwright browser binaries were restored, we tell
      # playwright to install just system deps.
      - name: Install Playwright's dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npm run playwright -- install-deps

      # We need the SDK to be built, so we can use it during performance tests
      - name: Build SDK
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run sdk:compile

      - name: Test performance
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run sdk:test:performance

      - name: Cache successful test results
        if: ${{ success() }}
        run: |
          touch ${{ env.TEST_STATUS_FILE }}

      - name: Do not cache test failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.TEST_STATUS_FILE }}

      - name: Create performance results section
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && success() && needs.environment.outputs.name == 'development' }}
        run: |
          CDP_FILE=./tests/performance/test-results/cdp-performance-tests.md
          CDP_TOTAL=$(grep '| Total |' "$CDP_FILE")
          CDP_SCRIPT=$(echo "$CDP_TOTAL" | awk -F'|' '{print $5}' | tr -d ' +')
          CDP_HEAP=$(echo "$CDP_TOTAL" | awk -F'|' '{print $7}' | tr -d ' +')
          SCRIPT_EVAL=$(grep 'Script Evaluation Time' ./tests/performance/test-results/lighthouse-startup-performance-tests.md | sed 's/.*| \([^|]*ms\) |.*/\1/' | tr -d ' +')
          {
            echo '<!-- perf-section -->'
            echo "<details>"
            echo "<summary><strong>Chrome DevTools Protocol Tracing</strong> (Script: ${CDP_SCRIPT}, Heap: ${CDP_HEAP})</summary>"
            echo ""
            cat "$CDP_FILE"
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary><strong>Lighthouse</strong> (Script Eval: ${SCRIPT_EVAL})</summary>"
            echo ""
            cat ./tests/performance/test-results/lighthouse-startup-performance-tests.md
            echo ""
            echo "</details>"
            echo '<!-- /perf-section -->'
          } > perf-section.md

      - name: Post or update PR comment with performance results
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && success() && needs.environment.outputs.name == 'development' }}
        run: |
          SECTION="$(cat perf-section.md)"
          MARKER="<!-- ci-results -->"
          gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate > comments.json
          COMMENT_ID=$(jq -r '.[]| select(.body | contains("'"$MARKER"'"))| .id' comments.json)

          if [[ -n "$COMMENT_ID" ]]; then
            EXISTING=$(gh api "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" --jq '.body')
            if echo "$EXISTING" | grep -q '<!-- perf-section -->'; then
              BODY=$(echo "$EXISTING" | perl -0777 -pe 's/<!-- perf-section -->.*?<!-- \/perf-section -->/'"$(echo "$SECTION" | sed 's/[&/\]/\\&/g')"'/s')
            else
              BODY="$EXISTING"$'\n\n'"$SECTION"
            fi
            gh api --method PATCH "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$BODY"
          else
            BODY="$MARKER"$'\n\n'"$SECTION"
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update artifact with performance results
        if: ${{ success() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: performance-results
          path: |
            ./tests/performance/test-results/cdp-performance-tests-baseline-tracing.json
            ./tests/performance/test-results/cdp-performance-tests-with-sdk-tracing.json
            ./tests/performance/test-results/lighthouse-startup-performance-tests-baseline-lighthouse-report.html
            ./tests/performance/test-results/lighthouse-startup-performance-tests-with-sdk-lighthouse-report.html

  test-cli:
    needs:
      - environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore previous test results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.TEST_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if test previously succeeded
        run: |
          if test -e ${{ env.TEST_STATUS_FILE }}; then
            echo 'TEST_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'TEST_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}

      - name: Install npm dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Test CLI
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run test --prefix cli

      - name: Cache successful test results
        if: ${{ success() }}
        run: |
          touch ${{ env.TEST_STATUS_FILE }}

      - name: Do not cache test failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.TEST_STATUS_FILE }}

  test-integration:
    needs:
      - environment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Run on PRs, also run these in staging so that we generate code coverage for pushes to main
    if: ${{ needs.environment.outputs.name == 'development' || needs.environment.outputs.name == 'staging' }}
    timeout-minutes: 10
    steps:
      - name: Restore previous test results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.TEST_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if test previously succeeded
        run: |
          if test -e ${{ env.TEST_STATUS_FILE }}; then
            echo 'TEST_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'TEST_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}

      - name: Install npm dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Get installed Playwright version
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        id: playwright-version
        run: echo "version=$(npm why --json playwright | jq --raw-output '.[].version' )" >> $GITHUB_OUTPUT

      - name: Restore cached playwright browsers
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        id: playwright-cache
        with:
          path: "~/.cache/ms-playwright"
          key: "${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}"
          # As a fallback, if the Playwright version has changed, try use the
          # most recently cached version. There's a good chance that at least one
          # of the browser binary versions haven't been updated, so Playwright can
          # skip installing that in the next step.
          # Note: When falling back to an old cache, `cache-hit` (used below)
          # will be `false`. This allows us to restore the potentially out of
          # date cache, but still let Playwright decide if it needs to download
          # new binaries or not.
          restore-keys: |
            ${{ runner.os }}-playwright-

      # If the Playwright browser binaries weren't restored, we tell
      # playwright to install everything for us.
      - name: Install Playwright browsers with dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npm run playwright -- install --with-deps

      # If the Playwright browser binaries were restored, we tell
      # playwright to install just system deps.
      - name: Install Playwright's dependencies
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npm run playwright -- install-deps

      # We need the SDK and CLI to be built, so we can use them in the sample apps
      - name: Build SDK and CLI
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run compile

      - name: Test Integration
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' }}
        # Build needs to run first so e2e tests can use the built apps and not build again
        # Run the e2e tests in a virtual display, since Playwright needs a display to run
        run: |
          npm run sdk:test:integration

      - name: Cache successful test results
        if: ${{ success() }}
        run: |
          touch ${{ env.TEST_STATUS_FILE }}

      - name: Do not cache test failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.TEST_STATUS_FILE }}

      - name: Create build results section
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && success() && needs.environment.outputs.name == 'development' }}
        run: |
          GZIP_SIZE=$(grep 'vite-7 - esnext' ./tests/integration/build-test-results/vite-7-tests.md | awk -F'|' '{print $4}' | tr -d ' +')
          {
            echo '<!-- build-section -->'
            echo "<details>"
            echo "<summary><strong>Platform Tests</strong> (vite-7 gzip: ${GZIP_SIZE})</summary>"
            echo ""
            for file in ./tests/integration/build-test-results/*.md; do
              cat "$file"
            done
            echo ""
            echo "</details>"
            echo '<!-- /build-section -->'
          } > build-section.md

      - name: Post or update PR comment with build results
        if: ${{ env.TEST_PREVIOUSLY_PASSED != 'true' && success() && needs.environment.outputs.name == 'development' }}
        run: |
          SECTION="$(cat build-section.md)"
          MARKER="<!-- ci-results -->"
          gh api "/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate > comments.json
          COMMENT_ID=$(jq -r '.[]| select(.body | contains("'"$MARKER"'"))| .id' comments.json)

          if [[ -n "$COMMENT_ID" ]]; then
            EXISTING=$(gh api "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" --jq '.body')
            if echo "$EXISTING" | grep -q '<!-- build-section -->'; then
              BODY=$(echo "$EXISTING" | perl -0777 -pe 's/<!-- build-section -->.*?<!-- \/build-section -->/'"$(echo "$SECTION" | sed 's/[&/\]/\\&/g')"'/s')
            else
              BODY="$EXISTING"$'\n\n'"$SECTION"
            fi
            gh api --method PATCH "/repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$BODY"
          else
            BODY="$MARKER"$'\n\n'"$SECTION"
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update artifact with build results
        if: ${{ needs.environment.outputs.name == 'development' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          include-hidden-files: true
          name: build-results
          path: tests/integration/platforms/*/.sonda/**/*.html

  commitlint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.6.4
      - name: Install npm dependencies
        run: |
          npm ci

      - name: Validate current commit (last commit) with commitlint
        if: github.event_name == 'push'
        run: npm run commitlint -- --last --verbose

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npm run commitlint -- --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate PR title with commitlint
        if: github.event_name == 'pull_request'
        run: |
          PR_TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title -q .title)
          echo "$PR_TITLE" | npm run commitlint --verbose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous lint results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.LINT_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if lint previously succeeded
        run: |
          if test -e ${{ env.LINT_STATUS_FILE }}; then
            echo 'LINT_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'LINT_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.LINT_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        if: ${{ env.LINT_PREVIOUSLY_PASSED != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.LINT_PREVIOUSLY_PASSED != 'true' }}

      - name: Install NPM dependencies
        if: ${{ env.LINT_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Lint
        if: ${{ env.LINT_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run sdk:lint

      - name: Cache successful lint results
        if: ${{ success() }}
        run: |
          touch ${{ env.LINT_STATUS_FILE }}

      - name: Do not cache lint failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.LINT_STATUS_FILE }}

  type-check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous type check results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.TYPE_CHECK_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if type check previously succeeded
        run: |
          if test -e ${{ env.TYPE_CHECK_STATUS_FILE }}; then
            echo 'TYPE_CHECK_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'TYPE_CHECK_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.TYPE_CHECK_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        if: ${{ env.TYPE_CHECK_PREVIOUSLY_PASSED != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.TYPE_CHECK_PREVIOUSLY_PASSED != 'true' }}

      - name: Install NPM dependencies
        if: ${{ env.TYPE_CHECK_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Type check
        if: ${{ env.TYPE_CHECK_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run sdk:check

      - name: Cache successful type check results
        if: ${{ success() }}
        run: |
          touch ${{ env.TYPE_CHECK_STATUS_FILE }}

      - name: Do not cache type check failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.TYPE_CHECK_STATUS_FILE }}

  validate-build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      VALIDATE_STATUS_FILE: validate.success.txt
    steps:
      - name: Restore previous validate results
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
        with:
          path: |
            ${{ env.VALIDATE_STATUS_FILE }}
          key: test.${{ github.job }}.sha-${{ github.sha }}.txt

      - name: Check if validate previously succeeded
        run: |
          if test -e ${{ env.VALIDATE_STATUS_FILE }}; then
            echo 'VALIDATE_PREVIOUSLY_PASSED=true' >> $GITHUB_ENV
          else
            echo 'VALIDATE_PREVIOUSLY_PASSED=false' >> $GITHUB_ENV
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        with:
          persist-credentials: false

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install -g npm@11.6.4
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}

      - name: Install NPM dependencies
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm ci

      - name: Build SDK
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run sdk:compile

      - name: Validate SDK
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run sdk:validate

      - name: Build CLI
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run cli:compile

      - name: Validate CLI
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run cli:validate

      - name: Build Demo
        if: ${{ env.VALIDATE_PREVIOUSLY_PASSED != 'true' }}
        run: |
          npm run build --prefix demo/frontend

      - name: Cache successful validate results
        if: ${{ success() }}
        run: |
          touch ${{ env.VALIDATE_STATUS_FILE }}

      - name: Do not cache validate failures
        if: ${{ failure() || cancelled() }}
        run: |
          rm -f ${{ env.VALIDATE_STATUS_FILE }}

  publish:
    needs:
      - environment
      - test-sdk-multiple-browsers
      - test-cli
      - lint
      - type-check
      - validate-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 10
    if: ${{ needs.environment.outputs.name == 'production' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11.6.4

      - name: Install NPM dependencies
        run: |
          npm ci

      - name: Build SDK and CLI
        run: |
          npm run compile

      - name: Publish SDK
        run: |
          npm publish --provenance --access public

      - name: Publish CLI
        run: |
          cd cli
          npm publish --provenance --access public

  # not used yet, there are no "production" releases
  report-release-slack:
    runs-on: ubuntu-latest
    if: ${{ needs.environment.outputs.name == 'production' }}
    needs:
      - publish
    steps:
      - name: "Send to #mission-web Slack channel/workflow"
        continue-on-error: true
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook-type: webhook-trigger
          webhook: ${{ secrets.SLACK_WEB_SDK_RELEASE_WEBHOOK_URL }}
          payload: |
            author: ${{ github.actor }}
            release_url: ${{ github.event.release.html_url }}
            release_name: ${{ github.event.release.name }}
