version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine@sha256:52e3ada4d978443601f286cc2f9e7b95c82aa3ad5a78ce9c6b94ce00258e68cc
    ports:
      - '7070:7070'
    networks:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf
    depends_on:
      grafana:
        condition: service_healthy
    restart: always

  grafana:
    image: grafana/otel-lgtm@sha256:64aa6aed2b94317475019a2cde883ac4f6d67e4b5fbdf9bea5ff229cc9583f5a
    ports:
      - '3000:3000'
      - '4317:4317'
      - '4318:4318'
    networks:
      - backend

networks:
  backend:
    driver: bridge
