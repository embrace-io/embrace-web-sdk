version: "3.8"

services:
  nginx:
    image: nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    ports:
      - "7070:7070"
    networks:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf
    depends_on:
      grafana:
        condition: service_healthy
    restart: always

  grafana:
    image: grafana/otel-lgtm@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    networks:
      - backend

networks:
  backend:
    driver: bridge
