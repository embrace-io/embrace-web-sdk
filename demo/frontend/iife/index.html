    <script>
      (function () {
        try {
          // Only install the stub if not already installed
          if (
            !window.EmbraceWebSdk ||
            !window.EmbraceWebSdk._isEmbraceProxyStub
          ) {
            window.EmbraceWebSdk = window.EmbraceWebSdk || {};
            window.EmbraceWebSdk._queue = window.EmbraceWebSdk._queue || [];
            window.EmbraceWebSdk._isEmbraceProxyStub = true; // Mark as stub

            function makeProxy(path) {
              return new Proxy(function () {}, {
                get(target, prop) {
                  // console.log('proxy get', path, prop);
                  if (prop === '_isEmbraceProxyStub') return true;
                  return makeProxy(path.concat([prop]));
                },
                apply(target, thisArg, args) {
                  console.log('apply', path, args);
                  window.EmbraceWebSdk._queue.push({
                    path: path,
                    args: Array.from(args),
                  });
                  return undefined;
                },
              });
            }

            Object.setPrototypeOf(window.EmbraceWebSdk, makeProxy([]));
          }
        } catch {
          // Fail silently if anything goes wrong
        }
        const script = document.createElement('script');
        script.onload = () => console.log('script loaded');
        script.async = true;
        script.src = '/iife.js';
        document.head.appendChild(script);
        console.log('script requested');
      })();
    </script>
    <script type="module">
      console.warn('module', window.EmbraceWebSdk);
      window.EmbraceWebSdk.sdk.initSDK({
        appVersion: '0.0.0',
        appID: 'XXXXX',
        appVersion: 'YOUR_APP_VERSION',
        logLevel: 60,
      });
    </script>
