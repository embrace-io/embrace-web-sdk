# Fixture registry for the template regression test. Never published.
#
# It holds one fixture file per kind of convention the project supports (attributes, attribute
# groups, events, ...), so each template has something to render. The attributes file defines the
# fixture's own attributes, in a public group of their own; every other file references the core
# registry's attributes, so any combination resolves. Most also import from the core registry, so
# the templates' provenance filters have something to filter out: a real registry often has no
# `imports` block, so a broken filter would be invisible there.
#
# Keep the core registry at the version the registry's own manifest depends on. A project without
# a registry of its own keeps it at the version the source registry depends on and bumps it with
# SOURCE_REGISTRY, so its copy of this file has no `# renovate:` line: Renovate mustn't move it
# alone.

schema_url: https://example.com/schemas/templates-fixture/0.0.0-dev
description: Fixture registry exercising every kind of convention the templates render.
stability: development
dependencies:
  - schema_url: https://opentelemetry.io/schemas/1.44.0
    registry_path: https://github.com/open-telemetry/semantic-conventions@v1.44.0[model]
