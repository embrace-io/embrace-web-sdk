# Deliberately empty. Weaver applies the first .weaver.toml it finds walking up from the working
# directory, so without this file one in a parent directory would apply to every make target here,
# and could skip policies or redirect dependencies to other copies. Settings belong on the weaver
# command lines in the Makefile, which CI and local runs share. Weaver notes this file on every
# run ("Experimental! - Found config"): that is expected.
