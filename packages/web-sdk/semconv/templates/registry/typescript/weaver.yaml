# The TypeScript attribute constants the web SDK takes from the embrace-semconv registry.
#
# The SDK consumes two of the registry's keys, listed in the filter below; every other attribute
# key stays hand-written in src/constants/attributes.ts.
templates:
  - pattern: attributes.ts.j2
    filter: >
      (.registry.attributes // [])
      | map(select(.provenance.source | not))
      | map(select(.key as $key
          | ["emb.user_session_id", "emb.session_part_id"] | any(. == $key)))
    application_mode: single
